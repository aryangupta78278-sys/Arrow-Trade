<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arrow Trade | Wallet Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#f5f6f8;
color:#18263a;
font-family:Arial,sans-serif
}
header{
background:#14243b;
color:white;
padding:20px
}
header h2{margin:0 0 6px}
header p{margin:0;color:#c7d0dc;font-size:13px}
.container{
padding:20px;
max-width:1200px;
margin:auto
}
.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
flex-wrap:wrap
}
button{
border:0;
padding:11px 16px;
border-radius:8px;
background:#14243b;
color:white;
cursor:pointer
}
input{
padding:12px;
border:1px solid #ddd;
border-radius:9px;
margin:10px 5px 10px 0;
width:min(100%,350px)
}
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
margin:20px 0
}
.stat,.card{
background:white;
padding:17px;
border-radius:12px;
box-shadow:0 3px 15px #00000008
}
.stat small,.muted{color:#788494}
.stat h2{margin:10px 0 0}
.tablewrap{
overflow-x:auto;
background:white;
border-radius:12px
}
table{
border-collapse:collapse;
width:100%;
min-width:700px
}
th,td{
text-align:left;
padding:14px;
border-bottom:1px solid #eee;
font-size:13px
}
th{
background:#f8f9fb;
color:#657184
}
.balance{
color:#15966a;
font-weight:bold
}
#message{
padding:12px;
margin:12px 0;
border-radius:8px;
background:#fff4dc;
color:#795b17;
display:none
}
a{
color:#14243b;
text-decoration:none
}
</style>
</head>

<body>

<header>
<h2>ARROW TRADE</h2>
<p>Admin Panel / Wallet Management</p>
</header>

<div class="container">

<div class="top">
<div>
<h2>Wallet Management</h2>
<p class="muted">Customer wallet overview</p>
</div>
<button onclick="loadWallets()">Refresh Data ↻</button>
</div>

<div id="message"></div>

<div class="stats">

<div class="stat">
<small>Total Wallets</small>
<h2 id="totalWallets">—</h2>
</div>

<div class="stat">
<small>Total Available Balance</small>
<h2 id="totalBalance">—</h2>
</div>

<div class="stat">
<small>Average Balance</small>
<h2 id="averageBalance">—</h2>
</div>

</div>

<div class="card">

<h3>Customer Wallets</h3>

<input
id="search"
placeholder="Search name or account ID..."
oninput="filterWallets()"
>

<div class="tablewrap">
<table>

<thead>
<tr>
<th>Customer</th>
<th>Account ID</th>
<th>User ID</th>
<th>Available Balance</th>
<th>Last Updated</th>
</tr>
</thead>

<tbody id="walletRows">
<tr>
<td colspan="5">Loading wallets...</td>
</tr>
</tbody>

</table>
</div>

</div>

<a href="admin.html">← Back to Admin Dashboard</a>

</div>
<script>

const SUPABASE_URL=
"https://sofargknzehbqkdlyywx.supabase.co";

const SUPABASE_KEY=
"sb_publishable_7In44w5vW2bEXL6f1PDNOw_vwva-09m";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let wallets=[];

function money(value){
return "₹"+Number(value||0).toLocaleString("en-IN",{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

function showMessage(text){
const el=document.getElementById("message");
el.style.display="block";
el.textContent=text;
}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

async function checkAdmin(){

const {data:{session},error}=await db.auth.getSession();

if(error||!session){
showMessage("Please login with your admin account.");
return false;
}

const {data:profile,error:profileError}=await db
.from("profiles")
.select("role")
.eq("id",session.user.id)
.single();

if(profileError||!profile||profile.role!=="admin"){
showMessage("Access denied. Admin account required.");
return false;
}

return true;
}

async function loadWallets(){

document.getElementById("walletRows").innerHTML=
'<tr><td colspan="5">Loading...</td></tr>';

if(!await checkAdmin())return;

const {data,error}=await db
.from("wallets")
.select("user_id,available_balance,updated_at")
.order("updated_at",{ascending:false});

if(error){
showMessage("Wallet loading error: "+error.message);
document.getElementById("walletRows").innerHTML=
'<tr><td colspan="5">Unable to load wallets.</td></tr>';
return;
}

wallets=data||[];

const userIds=[
...new Set(wallets.map(w=>w.user_id).filter(Boolean))
];

let profiles=[];

if(userIds.length){

const result=await db
.from("profiles")
.select("id,full_name,account_id")
.in("id",userIds);

if(!result.error){
profiles=result.data||[];
}

}

const profileMap={};

profiles.forEach(p=>{
profileMap[p.id]=p;
});

wallets=wallets.map(w=>({
...w,
customer:profileMap[w.user_id]||null
}));

const total=wallets.reduce(
(sum,w)=>sum+Number(w.available_balance||0),0
);

document.getElementById("totalWallets").textContent=
wallets.length;

document.getElementById("totalBalance").textContent=
money(total);

document.getElementById("averageBalance").textContent=
money(wallets.length?total/wallets.length:0);

renderWallets(wallets);

}

function renderWallets(rows){

const tbody=document.getElementById("walletRows");

if(!rows.length){
tbody.innerHTML=
'<tr><td colspan="5">No wallet records found.</td></tr>';
return;
}

tbody.innerHTML=rows.map(w=>`

<tr>

<td>
<strong>
${escapeHTML(w.customer?.full_name||"Customer")}
</strong>
</td>

<td>
${escapeHTML(w.customer?.account_id||"—")}
</td>

<td>
<small>${escapeHTML(w.user_id)}</small>
</td>

<td class="balance">
${money(w.available_balance)}
</td>

<td>
${w.updated_at
?new Date(w.updated_at).toLocaleString()
:"—"}
</td>

</tr>

`).join("");

}

function filterWallets(){

const q=document.getElementById("search")
.value.toLowerCase();

const filtered=wallets.filter(w=>{

const text=[
w.user_id,
w.customer?.full_name,
w.customer?.account_id
].join(" ").toLowerCase();

return text.includes(q);

});

renderWallets(filtered);

}

loadWallets();

</script>

</body>
</html>
