<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Arrow Trade</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;background:#f8f8f6;
 font-family:Arial,sans-serif;color:#14243b;padding:20px
}
.box{
 width:100%;max-width:420px;background:white;padding:38px;
 border:1px solid #e8e5dc;border-radius:16px;
 box-shadow:0 15px 45px rgba(0,0,0,.06)
}
.logo{font-size:27px;font-weight:bold;text-align:center;letter-spacing:2px}
.logo span{color:#b99a58}
h2{text-align:center;margin:30px 0 8px}
.sub{text-align:center;color:#777;font-size:14px;margin-bottom:28px}
label{font-size:13px;font-weight:bold;display:block;margin:17px 0 8px}
input{
 width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;
 font-size:15px;outline:none
}
input:focus{border-color:#b99a58}
button{
 width:100%;padding:15px;margin-top:24px;border:0;
 border-radius:8px;background:#14243b;color:white;
 font-size:15px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
#message{text-align:center;font-size:13px;margin-top:16px}
a{color:#a48645;text-decoration:none}
.bottom{text-align:center;margin-top:22px;font-size:14px;color:#777}
</style>
</head>
<body>

<div class="box">
 <div class="logo">ARROW <span>TRADE</span></div>
 <h2>Welcome Back</h2>
 <p class="sub">Login to access your account</p>

 <form id="loginForm">
  <label>Email Address</label>
  <input type="email" id="email" placeholder="Enter your email" required>

  <label>Password</label>
  <input type="password" id="password" placeholder="Enter your password" required>

  <button type="submit" id="loginBtn">LOGIN</button>
 </form>

 <div id="message"></div>

 <div class="bottom">
  Don't have an account? <a href="signup.html">Create Account</a>
  <br><br>
  <a href="index.html">Back to Home</a>
 </div>
</div>

<script>
const SUPABASE_URL = "https://sofargknzehbqkdlyywx.supabase.co";
const SUPABASE_KEY = "sb_publishable_7In44w5vW2bEXL6f1PDNOw_vwva-09m";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("loginForm").addEventListener("submit", async function(e){
 e.preventDefault();

 const btn = document.getElementById("loginBtn");
 const message = document.getElementById("message");

 btn.disabled = true;
 btn.textContent = "PLEASE WAIT...";
 message.textContent = "";

 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 try {
  const {data, error} = await db.auth.signInWithPassword({
   email,
   password
  });

  if(error) throw error;

  const user = data.user;

  const {data: profile, error: profileError} = await db
   .from("profiles")
   .select("role, account_suspended")
   .eq("id", user.id)
   .maybeSingle();

  if(profileError) throw profileError;

  if(profile && profile.account_suspended === true){
   await db.auth.signOut();
   throw new Error("Your account has been suspended. Contact support.");
  }

  message.style.color = "green";
  message.textContent = "Login successful! Redirecting...";

  setTimeout(() => {
   if(profile && profile.role === "admin"){
    window.location.href = "admin.html";
   } else {
    window.location.href = "dashboard.html";
   }
  }, 800);

 } catch(error) {
  message.style.color = "red";
  message.textContent = error.message || "Login failed.";
  btn.disabled = false;
  btn.textContent = "LOGIN";
 }
});
</script>

</body>
</html>
