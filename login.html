
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101c31">
<title>Login | Arrow Trade</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#101c31;
  --navy2:#172b49;
  --blue:#155bb3;
  --gold:#b99a58;
  --ink:#202b3d;
  --muted:#8290a3;
  --line:#e7ebf1;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:'DM Sans',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 10% 10%,rgba(185,154,88,.15),transparent 35%),
    radial-gradient(ellipse at 90% 85%,rgba(21,91,179,.13),transparent 35%),
    #f3f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  width:280px;
  height:280px;
  border:1px solid rgba(185,154,88,.18);
  border-radius:50%;
  top:-150px;
  right:-90px;
  pointer-events:none;
}

body:after{
  content:"";
  position:fixed;
  width:220px;
  height:220px;
  border:1px solid rgba(21,91,179,.12);
  border-radius:50%;
  bottom:-120px;
  left:-80px;
  pointer-events:none;
}

.box{
  position:relative;
  z-index:1;
  width:100%;
  max-width:465px;
  background:rgba(255,255,255,.94);
  padding:43px 38px 36px;
  border:1px solid rgba(255,255,255,.9);
  border-radius:23px;
  box-shadow:0 25px 75px rgba(20,36,59,.10);
  animation:cardEnter .65s ease both;
}

@keyframes cardEnter{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}

.logo{
  text-align:center;
  font-family:Manrope,sans-serif;
  font-size:29px;
  font-weight:800;
  letter-spacing:2.5px;
  color:var(--navy);
}

.logo span{color:var(--gold)}

.logo-line{
  width:45px;
  height:3px;
  background:var(--gold);
  border-radius:5px;
  margin:13px auto 0;
}

.tag{
  text-align:center;
  color:var(--gold);
  font-size:10px;
  font-weight:800;
  letter-spacing:2.5px;
  text-transform:uppercase;
  margin-top:29px;
}

h2{
  text-align:center;
  font-family:Manrope,sans-serif;
  font-size:30px;
  line-height:1.25;
  color:var(--navy);
  margin:10px 0 8px;
  letter-spacing:-.7px;
}

.sub{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:34px;
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:var(--navy);
  margin:19px 0 8px;
}

.field{position:relative}

input{
  width:100%;
  height:55px;
  padding:0 15px;
  border:1px solid #dfe5ed;
  border-radius:11px;
  background:#fbfcfe;
  font-family:inherit;
  font-size:14px;
  color:var(--navy);
  outline:none;
  transition:.2s;
}

input::placeholder{color:#a0a9b6}

input:focus{
  border-color:var(--gold);
  background:#fff;
  box-shadow:0 0 0 4px rgba(185,154,88,.10);
}

.password-toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:#8a96a7;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  padding:7px;
}

.password-toggle:hover{color:var(--blue)}

.submit-btn{
  width:100%;
  min-height:55px;
  margin-top:29px;
  border:0;
  border-radius:11px;
  background:linear-gradient(110deg,#101c31,#1c3d67);
  color:#fff;
  font-family:inherit;
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 10px 22px rgba(16,28,49,.17);
  transition:transform .2s,box-shadow .2s;
}

.submit-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 27px rgba(16,28,49,.22);
}

.submit-btn:disabled{
  opacity:.65;
  cursor:wait;
  transform:none;
}

#message{
  text-align:center;
  font-size:12px;
  margin-top:16px;
  line-height:1.7;
  overflow-wrap:anywhere;
}

.bottom{
  text-align:center;
  margin-top:27px;
  font-size:13px;
  color:var(--muted);
  line-height:2;
}

a{
  color:#9b7c3e;
  text-decoration:none;
  font-weight:700;
}

a:hover{color:var(--blue)}

.back-home{
  display:inline-block;
  margin-top:5px;
}

.security-note{
  text-align:center;
  margin-top:25px;
  padding-top:17px;
  border-top:1px solid var(--line);
  color:#9aa4b1;
  font-size:10px;
  letter-spacing:.3px;
}

@media(max-width:480px){
  body{padding:18px 13px}
  .box{
    padding:37px 23px 29px;
    border-radius:19px;
  }
  .logo{font-size:26px}
  h2{font-size:28px}
  .sub{font-size:13px}
  input{height:53px}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    transition:none!important;
  }
}

</style>
</head>

<body>

<div class="box">

  <div class="logo">
  <img
    src="https://raw.githubusercontent.com/aryangupta78278-sys/Arrow-Trade/main/IMG-20261126-WA0025.jpg"
    alt="Arrow Trade Logo"
    style="display:block;width:100%;max-width:330px;height:auto;margin:0 auto;"
  >
  </div>

  
  <h2>Welcome Back</h2>
  <p class="sub">Sign in to access your Arrow Trade account</p>

  <form id="loginForm">

    <label for="email">Email Address</label>
    <div class="field">
      <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
    </div>

    <label for="password">Password</label>
    <div class="field">
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
      <button class="password-toggle" type="button" id="passwordToggle">SHOW</button>
    </div>

    <button type="submit" class="submit-btn" id="loginBtn">
      LOGIN TO ACCOUNT
    </button>

  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <div class="bottom">
    Don't have an account?
    <a href="signup.html">Create Account</a>
    <br>
    <a class="back-home" href="index.html">← Back to Home</a>
  </div>

  <div class="security-note">
    ARROW TRADE · ACCOUNT ACCESS
  </div>

</div>

<script>
const SUPABASE_URL = "https://sofargknzehbqkdlyywx.supabase.co";
const SUPABASE_KEY = "sb_publishable_7In44w5vW2bEXL6f1PDNOw_vwva-09m";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Password visibility */
document.getElementById("passwordToggle").addEventListener("click", function(){
  const input = document.getElementById("password");
  const visible = input.type === "text";

  input.type = visible ? "password" : "text";
  this.textContent = visible ? "SHOW" : "HIDE";
});

document.getElementById("loginForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const btn = document.getElementById("loginBtn");
  const message = document.getElementById("message");

  btn.disabled = true;
  btn.textContent = "PLEASE WAIT...";
  message.textContent = "";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try{

    const {data,error} = await db.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    const user = data.user;

    const {data: profile, error: profileError} = await db
      .from("profiles")
      .select("role, account_suspended")
      .eq("id", user.id)
      .maybeSingle();

    if(profileError) throw profileError;

    if(profile && profile.account_suspended === true){
      await db.auth.signOut();
      throw new Error("Your account has been suspended. Contact support.");
    }

    message.style.color = "#168b68";
    message.textContent = "Login successful! Redirecting...";

    setTimeout(() => {
      if(profile && profile.role === "admin"){
        window.location.href = "admin.html";
      } else {
        window.location.href = "dashboard.html";
      }
    },800);

  }catch(error){

    message.style.color = "#d04444";
    message.textContent = error.message || "Login failed.";

    btn.disabled = false;
    btn.textContent = "LOGIN TO ACCOUNT";

  }

});
</script>

</body>
</html>
