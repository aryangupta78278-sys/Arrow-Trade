<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101c31">
<title>Create Account | Arrow Trade</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --navy:#101c31;
  --navy2:#172b49;
  --blue:#155bb3;
  --gold:#b99a58;
  --gold-light:#e2cf9f;
  --ink:#202b3d;
  --muted:#8290a3;
  --line:#e7ebf1;
  --white:#fff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:'DM Sans',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 10% 10%,rgba(185,154,88,.15),transparent 35%),
    radial-gradient(ellipse at 90% 85%,rgba(21,91,179,.13),transparent 35%),
    #f3f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  width:280px;
  height:280px;
  border:1px solid rgba(185,154,88,.18);
  border-radius:50%;
  top:-150px;
  right:-90px;
  pointer-events:none;
}

body:after{
  content:"";
  position:fixed;
  width:220px;
  height:220px;
  border:1px solid rgba(21,91,179,.12);
  border-radius:50%;
  bottom:-120px;
  left:-80px;
  pointer-events:none;
}

.box{
  position:relative;
  z-index:1;
  width:100%;
  max-width:465px;
  background:rgba(255,255,255,.94);
  padding:40px 38px 34px;
  border:1px solid rgba(255,255,255,.9);
  border-radius:23px;
  box-shadow:0 25px 75px rgba(20,36,59,.10);
  animation:cardEnter .65s ease both;
}

@keyframes cardEnter{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}

.logo{
  text-align:center;
  font-family:Manrope,sans-serif;
  font-size:29px;
  font-weight:800;
  letter-spacing:2.5px;
  color:var(--navy);
}

.logo span{color:var(--gold)}

.logo-line{
  width:45px;
  height:3px;
  background:var(--gold);
  border-radius:5px;
  margin:13px auto 0;
}

.tag{
  text-align:center;
  color:var(--gold);
  font-size:10px;
  font-weight:800;
  letter-spacing:2.5px;
  text-transform:uppercase;
  margin-top:27px;
}

h2{
  font-family:Manrope,sans-serif;
  text-align:center;
  font-size:29px;
  line-height:1.25;
  color:var(--navy);
  margin:10px 0 8px;
  letter-spacing:-.7px;
}

.sub{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:29px;
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:var(--navy);
  margin:17px 0 8px;
}

.field{
  position:relative;
}

input{
  width:100%;
  height:53px;
  padding:0 15px;
  border:1px solid #dfe5ed;
  border-radius:11px;
  background:#fbfcfe;
  font-family:inherit;
  font-size:14px;
  color:var(--navy);
  outline:none;
  transition:.2s;
}

input::placeholder{color:#a0a9b6}

input:focus{
  border-color:var(--gold);
  background:#fff;
  box-shadow:0 0 0 4px rgba(185,154,88,.10);
}

.password-toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:#8a96a7;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  padding:7px;
}

.password-toggle:hover{color:var(--blue)}

.submit-btn{
  width:100%;
  min-height:54px;
  margin-top:27px;
  border:0;
  border-radius:11px;
  background:linear-gradient(110deg,#101c31,#1c3d67);
  color:#fff;
  font-family:inherit;
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 10px 22px rgba(16,28,49,.17);
  transition:transform .2s,box-shadow .2s;
}

.submit-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 27px rgba(16,28,49,.22);
}

.submit-btn:disabled{
  opacity:.65;
  cursor:wait;
  transform:none;
}

#message{
  text-align:center;
  font-size:12px;
  margin-top:15px;
  line-height:1.7;
  overflow-wrap:anywhere;
}

.bottom{
  text-align:center;
  margin-top:25px;
  color:var(--muted);
  font-size:13px;
  line-height:2;
}

a{
  color:#9b7c3e;
  text-decoration:none;
  font-weight:700;
}

a:hover{color:var(--blue)}

.back-home{
  display:inline-block;
  margin-top:5px;
}

.security-note{
  text-align:center;
  margin-top:24px;
  padding-top:17px;
  border-top:1px solid var(--line);
  color:#9aa4b1;
  font-size:10px;
  letter-spacing:.3px;
}

@media(max-width:480px){
  body{padding:18px 13px}
  .box{
    padding:32px 23px 25px;
    border-radius:19px;
  }
  .logo{font-size:26px}
  h2{font-size:27px}
  .sub{font-size:13px}
  input{height:52px}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    transition:none!important;
  }
}
  /* ARROW TRADE - LANDING PAGE COLOUR MATCH */

body {
  background:
    linear-gradient(135deg, #f8faff 0%, #edf3ff 58%, #ffffff 100%) !important;
  color: #202b3d !important;
}

.box {
  background: #ffffff !important;
  border-color: #e6eaf1 !important;
  box-shadow: 0 18px 55px rgba(24,45,78,.09) !important;
}

.logo {
  color: #17243a !important;
}

.logo span {
  color: #155bb3 !important;
}

.logo-line {
  background: #b69a63 !important;
}

.tag {
  color: #155bb3 !important;
}

h2 {
  color: #17243a !important;
}

.sub,
.bottom {
  color: #718096 !important;
}

label {
  color: #17243a !important;
}

input {
  background: #fbfcfe !important;
  border-color: #e6eaf1 !important;

a {

</style>
</head>

<body>

<div class="box">

  <div class="logo">ARROW <span>TRADE</span></div>
  <div class="logo-line"></div>

  <div class="tag">Welcome to Arrow Trade</div>
  <h2>Create Your Account</h2>
  <p class="sub">Begin your journey with Arrow Trade</p>

  <form id="signupForm">

    <label for="name">Full Name</label>
    <div class="field">
      <input type="text" id="name" placeholder="Enter your full name" autocomplete="name" required>
    </div>

    <label for="email">Email Address</label>
<div class="field email-otp-row">
  <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>

  <button type="button" id="sendOtpBtn" class="submit-btn">
    GET OTP
  </button>
</div>

    <label for="password">Password</label>
    <div class="field">
      <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" autocomplete="new-password" required>
      <button class="password-toggle" type="button" data-target="password">SHOW</button>
    </div>

    <label for="confirmPassword">Confirm Password</label>
    <div class="field">
      <input type="password" id="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>
      <button class="password-toggle" type="button" data-target="confirmPassword">SHOW</button>
    </div>

    <button type="submit" class="submit-btn" id="signupBtn">
      <div class="field">
  <label for="emailOtp">Email OTP</label>
  <input type="text" id="emailOtp" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric">
      </div>
      CREATE ACCOUNT
    </button>

  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <div class="bottom">
    Already have an account?
    <a href="login.html">Login</a>
    <br>
    <a class="back-home" href="index.html">← Back to Home</a>
  </div>

  <div class="security-note">
    ARROW TRADE · ACCOUNT ACCESS
  </div>

</div>

<script>
const SUPABASE_URL = "https://sofargknzehbqkdlyywx.supabase.co";
const SUPABASE_KEY = "sb_publishable_7In44w5vW2bEXL6f1PDNOw_vwva-09m";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Password visibility */
document.querySelectorAll(".password-toggle").forEach(button => {
  button.addEventListener("click", () => {
    const input = document.getElementById(button.dataset.target);
    const visible = input.type === "text";
    input.type = visible ? "password" : "text";
    button.textContent = visible ? "SHOW" : "HIDE";
  });
});

let otpSentForEmail = "";

const sendOtpBtn = document.getElementById("sendOtpBtn");

sendOtpBtn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim().toLowerCase();
  const message = document.getElementById("message");

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    message.style.color = "#d04444";
    message.textContent = "Please enter a valid email address.";
    return;
  }

  sendOtpBtn.disabled = true;
  sendOtpBtn.textContent = "SENDING OTP...";
  message.textContent = "";

  try {
    const randomBytes = new Uint8Array(32);
    crypto.getRandomValues(randomBytes);

    const temporaryPassword = Array.from(randomBytes)
      .map(byte => byte.toString(16).padStart(2, "0"))
      .join("");

    const { error } = await db.auth.signUp({
      email: email,
      password: temporaryPassword
    });

    if (error) throw error;

    otpSentForEmail = email;

    message.style.color = "#168b68";
    message.textContent = "OTP sent successfully! Check your Gmail.";

    sendOtpBtn.textContent = "RESEND OTP";
    sendOtpBtn.disabled = false;

  } catch (error) {
    message.style.color = "#d04444";
    message.textContent = error.message || "OTP sending failed.";

    sendOtpBtn.textContent = "GET OTP";
    sendOtpBtn.disabled = false;
  }
});


document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = document.getElementById("signupBtn");
  const message = document.getElementById("message");

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const otp = document.getElementById("emailOtp").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (otpSentForEmail !== email) {
    message.style.color = "#d04444";
    message.textContent = "Please get OTP for this email first.";
    return;
  }

  if (!/^\d{6}$/.test(otp)) {
    message.style.color = "#d04444";
    message.textContent = "Please enter the 6-digit OTP.";
    return;
  }

  if (password.length < 6) {
    message.style.color = "#d04444";
    message.textContent = "Password must be at least 6 characters.";
    return;
  }

  if (password !== confirmPassword) {
    message.style.color = "#d04444";
    message.textContent = "Passwords do not match.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "VERIFYING OTP...";
  message.textContent = "";

  try {
    const { error: verifyError } = await db.auth.verifyOtp({
      email: email,
      token: otp,
      type: "signup"
    });

    if (verifyError) throw verifyError;

    const { error: updateError } = await db.auth.updateUser({
      password: password,
      data: {
        full_name: name
      }
    });

    if (updateError) throw updateError;

    message.style.color = "#168b68";
    message.textContent = "Email verified! Account created successfully.";

    document.getElementById("signupForm").reset();
    otpSentForEmail = "";

    document.querySelectorAll(".password-toggle").forEach(button => {
      button.textContent = "SHOW";
    });

    setTimeout(() => {
      window.location.href = "login.html";
    }, 2500);

  } catch (error) {
    message.style.color = "#d04444";
    message.textContent = error.message || "Verification failed.";

    btn.disabled = false;
    btn.textContent = "CREATE ACCOUNT";
  }
});
</script>

</body>
</html>
