<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrow Trade | Withdrawal Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#18263a;font-family:Arial,sans-serif}
header{background:#14243b;color:white;padding:20px}
header h2{margin:0 0 6px}
header p{margin:0;color:#c7d0dc;font-size:13px}
.container{padding:20px;max-width:1200px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button{border:0;padding:11px 16px;border-radius:8px;background:#14243b;color:white;cursor:pointer}
input,select{padding:12px;border:1px solid #ddd;border-radius:9px;margin:10px 5px 10px 0}
input{width:min(100%,350px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:20px 0}
.stat,.card{background:white;padding:17px;border-radius:12px;box-shadow:0 3px 15px #00000008}
.stat small,.muted{color:#788494}
.stat h2{margin:10px 0 0}
.tablewrap{overflow-x:auto;background:white;border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:850px}
th,td{text-align:left;padding:14px;border-bottom:1px solid #eee;font-size:13px}
th{background:#f8f9fb;color:#657184}
.badge{padding:5px 9px;border-radius:20px;font-size:11px;background:#edf1f5}
.pending{background:#fff2d8;color:#946500}
.approved{background:#e3f7ed;color:#138451}
.rejected{background:#ffe8e8;color:#c33}
#message{padding:12px;margin:12px 0;border-radius:8px;background:#fff4dc;color:#795b17;display:none}
a{color:#14243b;text-decoration:none}
</style>
</head>

<body>

<header>
<h2>ARROW TRADE</h2>
<p>Admin Panel / Withdrawal Management</p>
</header>

<div class="container">

<div class="top">
<div>
<h2>Withdrawal Management</h2>
<p class="muted">Customer withdrawal requests</p>
</div>
<button onclick="loadWithdrawals()">Refresh Data ↻</button>
</div>

<div id="message"></div>

<div class="stats">
<div class="stat">
<small>Total Requests</small>
<h2 id="total">—</h2>
</div>

<div class="stat">
<small>Total Amount</small>
<h2 id="amount">—</h2>
</div>

<div class="stat">
<small>Pending</small>
<h2 id="pending">—</h2>
</div>

<div class="stat">
<small>Approved</small>
<h2 id="approved">—</h2>
</div>

<div class="stat">
<small>Rejected</small>
<h2 id="rejected">—</h2>
</div>
</div>

<div class="card">
<h3>Withdrawal Requests</h3>

<input
id="search"
placeholder="Search customer or User ID..."
oninput="filterRows()"
>

<select id="statusFilter" onchange="filterRows()">
<option value="">All Status</option>
<option value="pending">Pending</option>
<option value="approved">Approved</option>
<option value="rejected">Rejected</option>
</select>

<div class="tablewrap">
<table>
<thead>
<tr>
<th>Customer</th>
<th>Amount</th>
<th>Payout Details</th>
<th>Status</th>
<th>Request Date</th>
</tr>
</thead>

<tbody id="withdrawalRows">
<tr><td colspan="5">Loading withdrawals...</td></tr>
</tbody>
</table>
</div>
</div>

<a href="admin.html">← Back to Admin Dashboard</a>

</div>

<script>
const SUPABASE_URL="https://sofargknzehbqkdlyywx.supabase.co";
const SUPABASE_KEY="sb_publishable_7In44w5vW2bEXL6f1PDNOw_vwva-09m";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let withdrawals=[];

function money(value){
return "₹"+Number(value||0).toLocaleString("en-IN",{
maximumFractionDigits:2
});
}

function showMessage(text){
const el=document.getElementById("message");
el.style.display="block";
el.textContent=text;
}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

async function checkAdmin(){

const {data:{session},error}=await db.auth.getSession();

if(error||!session){
showMessage("Please login with your admin account.");
return false;
}

const {data:profile,error:profileError}=await db
.from("profiles")
.select("role")
.eq("id",session.user.id)
.single();

if(profileError||!profile||profile.role!=="admin"){
showMessage("Access denied. Admin account required.");
return false;
}

return true;
}

async function loadWithdrawals(){

document.getElementById("withdrawalRows").innerHTML=
'<tr><td colspan="5">Loading...</td></tr>';

if(!await checkAdmin())return;

const {data,error}=await db
.from("withdrawals")
.select("id,user_id,amount,payout_details,status,created_at")
.order("created_at",{ascending:false});

if(error){
showMessage("Withdrawal loading error: "+error.message);
document.getElementById("withdrawalRows").innerHTML=
'<tr><td colspan="5">Unable to load withdrawal records.</td></tr>';
return;
}

withdrawals=data||[];

const userIds=[
...new Set(withdrawals.map(w=>w.user_id).filter(Boolean))
];

let profiles=[];

if(userIds.length){

const result=await db
.from("profiles")
.select("id,full_name,account_id")
.in("id",userIds);

if(!result.error){
profiles=result.data||[];
}
}

const profileMap={};

profiles.forEach(p=>{
profileMap[p.id]=p;
});

withdrawals=withdrawals.map(w=>({
...w,
customer:profileMap[w.user_id]||null
}));

document.getElementById("total").textContent=
withdrawals.length;

document.getElementById("amount").textContent=
money(withdrawals.reduce(
(sum,w)=>sum+Number(w.amount||0),0
));

document.getElementById("pending").textContent=
withdrawals.filter(w=>
String(w.status).toLowerCase()==="pending"
).length;

document.getElementById("approved").textContent=
withdrawals.filter(w=>
String(w.status).toLowerCase()==="approved"
).length;

document.getElementById("rejected").textContent=
withdrawals.filter(w=>
String(w.status).toLowerCase()==="rejected"
).length;

renderWithdrawals(withdrawals);
}

function renderWithdrawals(rows){

const tbody=document.getElementById("withdrawalRows");

if(!rows.length){
tbody.innerHTML=
'<tr><td colspan="5">No withdrawal requests found.</td></tr>';
return;
}

tbody.innerHTML=rows.map(w=>{

const status=String(w.status||"unknown").toLowerCase();
const customer=w.customer;

let payout="—";

if(w.payout_details){
payout=typeof w.payout_details==="object"
?JSON.stringify(w.payout_details)
:String(w.payout_details);
}

return `
<tr>
<td>
<strong>${escapeHTML(customer?.full_name||"Customer")}</strong>
<br>
<small class="muted">
${escapeHTML(customer?.account_id||w.user_id||"—")}
</small>
</td>

<td>${money(w.amount)}</td>

<td>${escapeHTML(payout)}</td>

<td>
<span class="badge ${
["pending","approved","rejected"].includes(status)?status:""
}">
${escapeHTML(status)}
</span>
</td>

<td>
${w.created_at
?new Date(w.created_at).toLocaleString()
:"—"}
</td>
</tr>
`;

}).join("");
}

function filterRows(){

const q=document.getElementById("search").value.toLowerCase();
const status=document.getElementById("statusFilter").value;

const filtered=withdrawals.filter(w=>{

const text=[
w.user_id,
w.customer?.full_name,
w.customer?.account_id,
w.payout_details
].map(x=>typeof x==="object"?JSON.stringify(x):String(x||""))
.join(" ").toLowerCase();

return text.includes(q)&&
(!status||String(w.status).toLowerCase()===status);

});

renderWithdrawals(filtered);
}

loadWithdrawals();
</script>

</body>
</html>
