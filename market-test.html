<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrow Trade Market Feed</title>
<style>
body{background:#101827;color:white;font-family:Arial;padding:20px}
.card{background:#1d293b;padding:18px;margin:12px 0;border-radius:12px}
.price{font-size:30px;font-weight:bold;margin:12px 0}
small{color:#aab6c8}
</style>
</head>
<body>
<h2>Arrow Trade Market Feed</h2>
<p id="status">Connecting...</p>
<div id="markets"></div>

<script>
const symbols=["EURUSD","GBPUSD","XAUUSD"];
const digits={EURUSD:5,GBPUSD:5,XAUUSD:2};
const container=document.getElementById("markets");

symbols.forEach(s=>{
 container.innerHTML+=`
 <div class="card">
  <h3>${s}</h3>
  <div class="price" id="${s}">Loading...</div>
  <small id="${s}_info">Waiting for quote...</small>
 </div>`;
});

async function updatePrice(symbol){
 try{
  const response=await fetch(
   "https://biquote.io/api/"+symbol,
   {cache:"no-store"}
  );
  if(!response.ok) throw new Error("HTTP "+response.status);

  const data=await response.json();
  const price=Number(data.mid);

  if(!Number.isFinite(price)) throw new Error("Invalid price");

  document.getElementById(symbol).textContent=
   price.toFixed(digits[symbol]);

  document.getElementById(symbol+"_info").textContent=
   "Updated: "+new Date().toLocaleTimeString()+
   " | "+(data.marketState||"unknown")+
   " | "+(data.stale?"STALE":"Not marked stale")+
   " | Quote age: "+data.quoteAgeSeconds+" sec";

 }catch(error){
  document.getElementById(symbol+"_info").textContent=
   "Feed error: "+error.message;
 }
}

async function refresh(){
 document.getElementById("status").textContent=
  "Checking market prices...";

 await Promise.all(symbols.map(updatePrice));

 document.getElementById("status").textContent=
  "Price check completed | Refresh every 5 seconds";
}

refresh();
setInterval(refresh,5000);
</script>
</body>
</html>
