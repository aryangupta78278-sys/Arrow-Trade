<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrow Trade Market Feed</title>

<style>
*{box-sizing:border-box}
body{
 background:#101827;color:white;
 font-family:Arial,sans-serif;padding:20px;
}
.card{
 background:#1d293b;padding:20px;
 margin:14px 0;border-radius:14px;
}
.price{font-size:32px;font-weight:bold;margin:14px 0}
small{color:#aab6c8;line-height:1.7}
.green{color:#38d9a0}
.red{color:#ff737d}
</style>
</head>

<body>

<h2>Arrow Trade Market Feed</h2>
<p id="status">Connecting to market...</p>

<div id="markets"></div>

<script>
const symbols=["EUR/USD","GBP/USD","XAU/USD"];

const digits={
 "EUR/USD":5,
 "GBP/USD":5,
 "XAU/USD":5
};

const container=document.getElementById("markets");
let refreshing=false;

const lastPrices={};

symbols.forEach(symbol=>{
 const id=symbol.replace("/","");
 container.innerHTML+=`
 <div class="card">
  <h3>${symbol}</h3>
  <div class="price" id="price_${id}">Loading...</div>
  <small id="info_${id}">Waiting for market data...</small>
 </div>`;
});

async function refreshPrices(){

 if(refreshing)return;
 refreshing=true;

 document.getElementById("status").textContent=
 "Fetching prices from Twelve Data...";

 try{

  const response=await fetch(
   "/api/market?symbols="+
   encodeURIComponent(symbols.join(",")),
   {cache:"no-store"}
  );

  if(!response.ok){
   throw new Error("API HTTP "+response.status);
  }

  const data=await response.json();

  if(!data.prices){
   throw new Error(data.error||"Invalid API response");
  }

  const receivedAt=new Date().toLocaleTimeString();

  let success=0;

  symbols.forEach(symbol=>{

   const id=symbol.replace("/","");
   const item=data.prices[symbol];

   const price=Number(item?.price);

   if(!item || item.error || !Number.isFinite(price) || price<=0){

    document.getElementById("info_"+id).innerHTML=
     '<span class="red">Price unavailable: '+
     (item?.error||"No valid price")+'</span>';

    return;
   }

   lastPrices[symbol]=price;

   document.getElementById("price_"+id).textContent=
    price.toFixed(digits[symbol]);

   document.getElementById("info_"+id).innerHTML=
    '<span class="green">Price received</span><br>'+
    'Last response: '+receivedAt+
    '<br>Source: '+data.source+
    '<br>API cache: '+(data.cached?"Yes":"No");

   success++;
  });

  document.getElementById("status").textContent=
   success+" of "+symbols.length+
   " market prices received | Refresh every 30 seconds";

 }catch(error){

  document.getElementById("status").innerHTML=
   '<span class="red">Connection error: '+
   error.message+'</span>';

  symbols.forEach(symbol=>{
   const id=symbol.replace("/","");
   document.getElementById("info_"+id).innerHTML=
    '<span class="red">Latest request failed. '+
    'Displayed price, if any, is not confirmed fresh.</span>';
  });

 }finally{
  refreshing=false;
 }
}

refreshPrices();
setInterval(refreshPrices,30000);

</script>
</body>
</html>
